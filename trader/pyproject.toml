[project]
name = "tradekit"
version = "0.1.0"
description = "Intraday + swing scanner, alerts, backtests and a learning alert filter for US stocks (IBKR)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "joblib", "pyyaml", "ib_async>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tradekit = "tradekit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradekit*"]
